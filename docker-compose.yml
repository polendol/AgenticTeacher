services:
  # The local LLM server
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama      # models are stored here and survive restarts
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    NVIDIA GPU (strongly recommended for speed): uncomment the lines below
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-off job: downloads qwen3:4b the first time, then exits
  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen3:4b"]
    restart: "no"

  # The web app
  app:
    build: .
    ports:
      - "7681:7681"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # Optional: if your functions module reads os.getenv("CEFR_MODEL_PATH"), select the model here
      # CEFR_MODEL_PATH: /app/models/deberta-cefr
    volumes:
      - ./models:/app/models:ro        # all your model folders; only the one your code loads is used
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama_data: